<p-toast position="top-center" />

<div class="flex min-h-dvh flex-col">
  <header class="flex items-center justify-between gap-2 px-4 py-2">
    <img src="logo.png" alt="GYST" class="h-6 w-auto" />

    <div class="flex items-center gap-2">
      @if (authService.user(); as user) {
        @if (user.photoURL) {
          <img
            [src]="user.photoURL"
            referrerpolicy="no-referrer"
            class="h-8 w-8 rounded-full object-cover"
            [alt]="user.displayName ?? 'Account'"
          />
        }
      }
      <p-button icon="pi pi-search" [text]="true" [rounded]="true" severity="secondary" ariaLabel="Search" routerLink="/search" />
      <p-button icon="pi pi-cog" [text]="true" [rounded]="true" severity="secondary" ariaLabel="Settings" routerLink="/settings" />
    </div>
  </header>

  <main class="flex-1 overflow-y-auto pb-24">
    <router-outlet />
  </main>

  <!-- <app-chat-panel /> hidden for now — re-add once ANTHROPIC_API_KEY is set (see README). -->
  <app-nav />
</div>
