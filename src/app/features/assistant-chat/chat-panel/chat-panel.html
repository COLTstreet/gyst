@if (open()) {
  <div
    class="fixed inset-x-4 bottom-24 z-20 flex max-h-[70vh] flex-col overflow-hidden rounded-xl border shadow-xl sm:inset-x-auto sm:right-4 sm:w-96"
    style="background: var(--p-surface-800); border-color: var(--p-surface-700)"
  >
    <header class="flex items-center justify-between border-b p-3" style="border-color: var(--p-surface-700)">
      <span class="text-sm font-medium">Assistant</span>
      <p-button icon="pi pi-times" [text]="true" [rounded]="true" severity="secondary" ariaLabel="Close chat" (onClick)="toggle()" />
    </header>

    <div class="flex-1 overflow-y-auto p-3">
      @for (message of assistantService.messages(); track message.id) {
        <app-chat-message [message]="message" />
      } @empty {
        <p class="py-8 text-center text-sm" style="color: var(--p-text-muted-color)">
          Ask me to add a task, jot a note, anything.
        </p>
      }

      @if (assistantService.conversation()?.pendingConfirmation; as confirmation) {
        <app-confirmation-prompt [confirmation]="confirmation" />
      }
    </div>

    <form class="flex gap-2 border-t p-3" style="border-color: var(--p-surface-700)" (submit)="$event.preventDefault(); send()">
      <input
        pInputText
        class="flex-1"
        placeholder="Message the assistant…"
        [disabled]="!!assistantService.conversation()?.pendingConfirmation"
        [ngModel]="draft()"
        (ngModelChange)="draft.set($event)"
        name="chatDraft"
      />
      <p-button
        type="submit"
        icon="pi pi-send"
        [loading]="assistantService.sending()"
        [disabled]="!draft().trim() || !!assistantService.conversation()?.pendingConfirmation"
      />
    </form>
  </div>
}

<p-button
  styleClass="fixed bottom-24 right-4 z-20"
  [icon]="open() ? 'pi pi-times' : 'pi pi-comment'"
  [rounded]="true"
  size="large"
  ariaLabel="Toggle assistant chat"
  (onClick)="toggle()"
/>
