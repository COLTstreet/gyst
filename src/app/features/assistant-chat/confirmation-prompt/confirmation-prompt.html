<div
  class="rounded-lg border p-3 text-sm"
  style="border-color: var(--p-orange-800); background: color-mix(in srgb, var(--p-orange-950) 60%, transparent)"
>
  <p class="mb-2">{{ confirmation().description }}</p>
  <div class="flex gap-2">
    <p-button label="Confirm" severity="danger" (onClick)="confirm(true)" />
    <p-button label="Cancel" severity="secondary" [outlined]="true" (onClick)="confirm(false)" />
  </div>
</div>
