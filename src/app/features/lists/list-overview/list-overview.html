<p-confirmdialog />

<div class="mx-auto flex max-w-lg flex-col gap-4 p-4">
  <header class="flex items-center justify-between">
    <h1 class="text-lg font-semibold">Lists</h1>
    <p-button icon="pi pi-plus" [rounded]="true" (onClick)="openCreateDialog()" />
  </header>

  <div class="grid grid-cols-2 gap-3">
    @for (list of listService.lists(); track list.id) {
      <a [routerLink]="['/lists', list.id]">
        <p-card>
          <div class="flex items-start justify-between gap-2">
            <div>
              <p class="font-medium">{{ list.name }}</p>
              <p class="text-xs" style="color: var(--p-card-subtitle-color)">{{ list.items.length }} items</p>
            </div>
            <p-button
              icon="pi pi-trash"
              [text]="true"
              severity="secondary"
              ariaLabel="Delete list"
              (onClick)="confirmDeleteList($event, list)"
            />
          </div>
        </p-card>
      </a>
    } @empty {
      <p class="col-span-2 py-8 text-center text-sm" style="color: var(--p-text-muted-color)">No lists yet.</p>
    }
  </div>
</div>

<p-dialog header="New list" [(visible)]="showCreateDialog" [modal]="true" [style]="{ width: '20rem' }">
  <input
    pInputText
    class="w-full"
    placeholder="List name"
    [ngModel]="newListName()"
    (ngModelChange)="newListName.set($event)"
  />
  <div class="mt-4 flex justify-end gap-2">
    <p-button label="Create" [disabled]="!newListName().trim()" (onClick)="createList()" />
  </div>
</p-dialog>
