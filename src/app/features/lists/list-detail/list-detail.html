@if (list(); as list) {
  <div class="mx-auto flex max-w-lg flex-col gap-4 p-4">
    <h1 class="text-lg font-semibold">{{ list.name }}</h1>

    <form (submit)="$event.preventDefault(); addItem()">
      <p-inputgroup>
        <input
          pInputText
          placeholder="Add item…"
          [ngModel]="newItemText()"
          (ngModelChange)="newItemText.set($event)"
          name="newItem"
        />
        <p-inputgroup-addon>
          <p-button type="submit" icon="pi pi-plus" [text]="true" [disabled]="!newItemText().trim()" />
        </p-inputgroup-addon>
      </p-inputgroup>
    </form>

    <ul class="flex flex-col gap-2">
      @for (item of list.items; track item.id) {
        <li>
          <p-card>
            <div class="flex items-center gap-3">
              <p-checkbox
                [binary]="true"
                [ngModel]="item.checked"
                (ngModelChange)="toggleChecked(item.id, $event)"
              />
              <span
                class="flex-1 text-sm"
                [style.text-decoration]="item.checked ? 'line-through' : 'none'"
                [style.color]="item.checked ? 'var(--p-card-subtitle-color)' : 'var(--p-card-color)'"
              >
                {{ item.text }}
              </span>
              <p-button icon="pi pi-trash" [text]="true" severity="secondary" ariaLabel="Remove item" (onClick)="removeItem(item.id)" />
            </div>
          </p-card>
        </li>
      } @empty {
        <p class="py-8 text-center text-sm" style="color: var(--p-text-muted-color)">This list is empty.</p>
      }
    </ul>
  </div>
} @else {
  <p class="p-4 text-center text-sm" style="color: var(--p-text-muted-color)">List not found.</p>
}
