<div class="mx-auto flex max-w-lg flex-col gap-4 p-4">
  <header class="flex items-center justify-between">
    <h1 class="text-lg font-semibold">Tasks</h1>
    <p-button icon="pi pi-plus" [rounded]="true" (onClick)="openNewTask()" />
  </header>

  <p-selectbutton
    [options]="filterOptions"
    optionLabel="label"
    optionValue="value"
    [ngModel]="filter()"
    (ngModelChange)="filter.set($event)"
  />

  <ul class="flex flex-col gap-2">
    @for (task of filteredTasks(); track task.id) {
      <li>
        <p-card>
          <div class="flex items-center gap-3">
            <p-checkbox
              [binary]="true"
              [ngModel]="task.status === 'completed'"
              (ngModelChange)="toggleComplete(task)"
            />
            <a
              [routerLink]="['/tasks', task.id]"
              class="flex-1 text-sm"
              [style.text-decoration]="task.status === 'completed' ? 'line-through' : 'none'"
              [style.color]="task.status === 'completed' ? 'var(--p-card-subtitle-color)' : 'var(--p-card-color)'"
            >
              {{ task.title }}
              @if (task.dueDate) {
                <span class="ml-2 text-xs" style="color: var(--p-card-subtitle-color)">
                  {{ task.dueDate.toDate() | date: 'MMM d' }}
                </span>
              }
            </a>
            <p-tag [value]="task.priority" [severity]="prioritySeverity[task.priority]" />
          </div>
        </p-card>
      </li>
    } @empty {
      <p class="py-8 text-center text-sm" style="color: var(--p-text-muted-color)">No tasks here.</p>
    }
  </ul>
</div>
