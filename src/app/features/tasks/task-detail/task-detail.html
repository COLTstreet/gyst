<p-confirmdialog />

@if (task(); as task) {
  <div class="mx-auto flex max-w-lg flex-col gap-4 p-4">
    <p-card>
      <div class="flex flex-col gap-3">
        <div class="flex items-start justify-between gap-3">
          <h1 class="text-lg font-semibold">{{ task.title }}</h1>
          <p-tag [value]="task.priority" [severity]="prioritySeverity[task.priority]" />
        </div>

        @if (task.notes) {
          <p class="text-sm" style="color: var(--p-card-subtitle-color)">{{ task.notes }}</p>
        }

        @if (task.dueDate) {
          <p class="text-sm" style="color: var(--p-card-subtitle-color)">
            Due {{ task.dueDate.toDate() | date: 'medium' }}
          </p>
        }
      </div>
    </p-card>

    <div class="flex gap-2">
      <p-button
        [label]="task.status === 'completed' ? 'Mark open' : 'Mark complete'"
        styleClass="flex-1"
        (onClick)="toggleComplete()"
      />
      <p-button label="Delete" severity="danger" [outlined]="true" (onClick)="confirmDelete()" />
    </div>
  </div>
} @else {
  <p class="p-4 text-center text-sm" style="color: var(--p-text-muted-color)">Task not found.</p>
}
